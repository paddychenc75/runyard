name: exp-determinism
on:
  push:
    branches: [fix/ui-visual-determinism]
permissions:
  contents: read
jobs:
  gen:
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      matrix:
        job: [A, B]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @runyard/ui visual:install
      - name: 生成两次
        env:
          RUNYARD_UI_BASELINE: update
        run: |
          mkdir -p out
          pnpm ui:visual || true
          git status --porcelain packages/ui/visual/__screenshots__ | wc -l
          touch out/marker
          sleep 2
          pnpm ui:visual || true
          echo "== 第二次运行改写了的文件"
          find packages/ui/visual/__screenshots__ -newer out/marker -name '*.png' | wc -l
          echo "== 第三次比对模式"
          RUNYARD_UI_BASELINE= pnpm ui:visual 2>&1 | tail -5
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: out-${{ matrix.job }}
          path: out/
