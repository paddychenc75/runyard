name: exp-determinism
on:
  push:
    branches: [fix/ui-visual-determinism]
permissions:
  contents: read
jobs:
  gen:
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      matrix:
        job: [A, B]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @runyard/ui visual:install
      - name: 生成两次
        env:
          RUNYARD_UI_BASELINE: update
        run: |
          mkdir -p out/r1 out/r2
          pnpm ui:visual || true
          cp packages/ui/visual/__screenshots__/*.png out/r1/
          pnpm ui:visual || true
          cp packages/ui/visual/__screenshots__/*.png out/r2/
          PWC=$(pwd)/packages/ui/package.json
          echo "== 同一任务内 r1 vs r2"
          node exp/compare.mjs $PWC out/r1 out/r2
          echo "== r1 vs 仓库里的基准（git）"
          mkdir -p out/git && git show HEAD --stat >/dev/null
          git checkout -- packages/ui/visual/__screenshots__ 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: out-${{ matrix.job }}
          path: out/
  compare:
    needs: gen
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dl
      - run: |
          PWC=$(pwd)/packages/ui/package.json
          echo "== 跨任务 A.r1 vs B.r1"
          node exp/compare.mjs $PWC dl/out-A/r1 dl/out-B/r1
          echo "== 仓库基准 vs A.r1"
          node exp/compare.mjs $PWC packages/ui/visual/__screenshots__ dl/out-A/r1
