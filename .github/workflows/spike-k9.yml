# K9a/K9b 技术验证（一次性，M0a 结束时随 spikes/k9 一起删除）。
# 只在推送到 spike/k9-* 分支且改了 spikes/k9 或本文件时运行，也可手动触发。
name: spike-k9

on:
  push:
    branches: ["spike/k9-*"]
    paths:
      - "spikes/k9/**"
      - ".github/workflows/spike-k9.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: K9a macOS（废纸篓）
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: spikes/k9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: spikes/k9/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: 安装依赖（只有对照用的 trash 包）
        run: pnpm install --frozen-lockfile
      - name: 运行 K9a 实验（含会弹权限框的变体，只在运行器上跑）
        run: node mac/run.mjs --ci --label ci-macos26
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: k9-macos-results
          path: spikes/k9/results/
          if-no-files-found: warn

  windows:
    name: K9b Windows（回收站、改名）
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spikes/k9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: spikes/k9/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: 安装依赖（vite 8.3.1、trash 10.1.1，精确版本）
        run: pnpm install --frozen-lockfile
      - name: 运行 K9b 实验
        run: node win/run.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: k9-windows-results
          path: spikes/k9/results/
          if-no-files-found: warn
