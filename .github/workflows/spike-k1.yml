# 技术验证 K1（共用的管理进程）在三个系统上的实验。一次性的：M0a 结束时随 spikes/k1 一起删除。
# 只在 spike/k1-* 分支上、改到 spikes/k1 或本文件时运行；不属于 PR 的必过检查。
name: spike-k1

on:
  push:
    branches: ["spike/k1-*"]
    paths:
      - "spikes/k1/**"
      - ".github/workflows/spike-k1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiments:
    name: K1 实验（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-2025]
    defaults:
      run:
        shell: bash
        working-directory: spikes/k1
    env:
      # 允许“另一个系统用户”实验新建临时用户或使用 sudo -u nobody；只在一次性的 CI 机器上打开
      K1_ALLOW_OTHER_USER: "1"
    steps:
      - name: 关闭换行转换
        working-directory: .
        run: git config --global core.autocrlf false

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 pnpm（版本读自根 package.json 的 packageManager 字段）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 安装 Node（版本读自 .node-version）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: 安装 K1 自己的依赖（独立的锁文件）
        run: pnpm install --frozen-lockfile

      # Electron 44 的 npm 包没有安装脚本，二进制在第一次使用时才下载；这里先下好，不让下载时间混进测量
      - name: 下载 Electron 二进制（校验和由包里的 checksums.json 核对）
        run: pnpm exec install-electron

      - name: 运行全部实验（Linux：虚拟显示器；临时目录放 /tmp，别的用户才走得到那一层）
        if: runner.os == 'Linux'
        env:
          K1_TMP_BASE: /tmp
        run: xvfb-run -a node experiments/run-all.mjs

      - name: 运行全部实验（macOS）
        if: runner.os == 'macOS'
        env:
          K1_TMP_BASE: /tmp
        run: node experiments/run-all.mjs

      - name: 运行全部实验（Windows）
        if: runner.os == 'Windows'
        run: node experiments/run-all.mjs

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k1-results-${{ matrix.os }}
          path: spikes/k1/results/*.json
          if-no-files-found: warn
          retention-days: 30
