# K4 技术验证：管道输出能否成为干净的日志（技术设计 §11.1）。一次性工作流，M0a 结束时随 spikes/k4 一起删除。
name: spike-k4

on:
  push:
    branches: ["spike/k4-*"]
    paths:
      - "spikes/k4/**"
      - ".github/workflows/spike-k4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k4:
    name: k4（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 pnpm（版本读自根 package.json 的 packageManager 字段）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 安装 Node（版本读自 .node-version）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: 安装 Python 3.12（PRD 要求 3.12 以上）
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: 安装 uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: 安装 Go 1.26
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: 工具版本
        run: |
          node -v; pnpm -v; python --version; uv --version; go version
          which pnpm python uv go || true

      - name: 实验（普通路径）
        run: node spikes/k4/run.mjs --out k4-results/main

      - name: 实验（路径含中文和空格；只测默认档和推荐档）
        if: always()
        run: node spikes/k4/run.mjs --cn --out k4-results/cn --only selftest,languages,vite,next --profiles default,rec-nocolor

      - name: 汇总写入作业摘要
        if: always()
        run: |
          for f in k4-results/main/summary.md k4-results/cn/summary.md; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
          true

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k4-${{ matrix.os }}
          path: k4-results
          retention-days: 14
