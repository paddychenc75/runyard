# #400：真实页面组件的契约工作台；独立于组件基准，不冒充原生预览或主进程E2E。
name: desktop-visual
on:
  pull_request:
    branches: [main]
    paths: [apps/desktop/**, packages/ui/**, packages/tokens/**, packages/i18n/**, docs/design/**, tooling/checks/screen-coverage*, .github/workflows/desktop-visual.yml, .github/workflows/desktop-baseline.yml, pnpm-lock.yaml]
  push:
    branches: [main]
    paths: [apps/desktop/**, packages/ui/**, packages/tokens/**, packages/i18n/**, docs/design/**, tooling/checks/screen-coverage*, .github/workflows/desktop-visual.yml, .github/workflows/desktop-baseline.yml, pnpm-lock.yaml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  screens:
    name: desktop-visual（画面基准与伪语言）
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: 安装 Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 安装已锁定依赖
        run: pnpm install --frozen-lockfile
      - name: 安装已有 Playwright 的 Chromium
        run: pnpm --filter @runyard/ui visual:install
      - name: 画板覆盖、体积预算与画面回归
        run: |
          pnpm check
          node apps/desktop/visual/check-budget.ts
          pnpm --filter @runyard/desktop visual:screens
      - name: 上传执行覆盖与差异截图
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-screen-results
          path: apps/desktop/visual/.output/
          if-no-files-found: error
          retention-days: 14
