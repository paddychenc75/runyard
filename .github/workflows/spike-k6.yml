# 技术验证 K6（macOS 部分）：在一次性的 CI 机器上安装真正的版本管理器和 fish，对照 spikes/k6 里的假实现。
# 一次性实验，M0a 结束时随 spikes/ 一起删除。
name: spike-k6

on:
  push:
    branches: ["spike/k6-*"]
    paths:
      - "spikes/k6/**"
      - ".github/workflows/spike-k6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macos-26（真实版本管理器、fish、p10k、starship）
    runs-on: macos-26
    timeout-minutes: 75
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      K6_OUT: ${{ github.workspace }}/k6-results
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: 记录环境
        run: |
          sw_vers; uname -m; node -v; echo "node: $(which node)"; /usr/bin/python3 --version; echo "SHELL=$SHELL"; dscl . -read /Users/$USER UserShell
          echo "K6_NODE_BIN=$(dirname "$(which node)")" >> "$GITHUB_ENV"
      - name: 安装 fish 和版本管理器（一次性机器，逐个装，失败不拦）
        run: |
          for f in fish zsh-syntax-highlighting nvm fnm volta mise asdf pyenv uv starship powerlevel10k; do
            if brew install "$f" >/tmp/brew-$f.log 2>&1; then echo "installed $f $(brew list --versions $f)"; else echo "FAILED $f"; tail -5 /tmp/brew-$f.log; fi
          done
          echo "K6_P10K_DIR=$(brew --prefix)/share/powerlevel10k" >> "$GITHUB_ENV"
      - name: 矩阵（假实现 + fish）
        if: always()
        run: node spikes/k6/src/run.mjs matrix score
      - name: 杂乱的启动文件
        if: always()
        run: node spikes/k6/src/run.mjs messy
      - name: 真实版本管理器
        if: always()
        timeout-minutes: 40
        run: node spikes/k6/src/run.mjs real-managers
      - name: 计时、模拟 Finder、真实 GUI 启动
        if: always()
        continue-on-error: true
        run: K6_N=25 node spikes/k6/src/run.mjs timing finder gui
      - name: 消融和按项目目录
        if: always()
        timeout-minutes: 20
        run: node spikes/k6/src/run.mjs ablation project
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: k6-macos-results
          path: k6-results
          retention-days: 14

  linux:
    name: ubuntu-latest（第二个数据点：bash、zsh、fish）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      K6_OUT: ${{ github.workspace }}/k6-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: 安装 fish 和 zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fish zsh && fish --version && zsh --version && bash --version | head -1 && getent passwd "$USER"
      - name: 矩阵
        run: node spikes/k6/src/run.mjs matrix score
      - name: 杂乱的启动文件
        if: always()
        run: node spikes/k6/src/run.mjs messy
      - name: 计时、消融、按项目目录
        if: always()
        timeout-minutes: 15
        run: K6_N=20 node spikes/k6/src/run.mjs ablation project timing finder
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: k6-linux-results
          path: k6-results
          retention-days: 14
