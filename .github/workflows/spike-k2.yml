# K2 技术验证（技术设计 §11.1）：输出走管道时，能否干净地停掉整棵进程树并释放端口。
# 只在 spike/k2-* 分支上跑，M0a 结束时和 spikes/k2/ 一起删除。Action 的版本和哈希见 spikes/k2/README.md。
name: spike-k2

on:
  push:
    branches: ["spike/k2-*"]
    paths:
      - "spikes/k2/**"
      - ".github/workflows/spike-k2.yml"
      # 只改说明和结果文件时不重跑
      - "!spikes/k2/**/*.md"
      - "!spikes/k2/results/**"
  workflow_dispatch:
    inputs:
      reps:
        description: 每个运行器起停多少次
        default: "50"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: ${{ matrix.os }} / ${{ matrix.group }} / ${{ matrix.half }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-2025]
        group: [light, vite, next, nuxt4, nuxt3]
        # Windows 的停止办法多，分两半跑，每个任务才不超过 30 分钟；另两个系统只有一种办法
        half: [a, b]
        exclude:
          - { os: ubuntu-latest, half: b }
          - { os: macos-26, half: b }
    defaults:
      run:
        shell: bash
    env:
      REPS: ${{ inputs.reps || '50' }}
      OUT: ${{ matrix.os }}-${{ matrix.group }}-${{ matrix.half }}
    steps:
      - name: 关闭换行转换
        run: git config --global core.autocrlf false

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 pnpm（版本读自 package.json 的 packageManager 字段）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 安装 Node（版本读自 .node-version）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: 安装 Go 1.26（只有 light 组用）
        if: matrix.group == 'light'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: 安装 Python 3.12（只有 light 组用）
        if: matrix.group == 'light'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # 只为看 uv run 起了哪些进程；0.12.19 发布于 2026-09-25，OSV 无公告
      - name: 安装 uv（只有 light 组用）
        if: matrix.group == 'light'
        run: python -m pip install --disable-pip-version-check uv==0.12.19

      - name: 编译 runyard-job.exe（仅 Windows）
        if: runner.os == 'Windows'
        run: bash spikes/k2/win/build.sh

      - name: 安装 node-pty（仅 Windows 的后一半，只为对比）
        if: runner.os == 'Windows' && matrix.half == 'b'
        working-directory: spikes/k2/pty
        run: pnpm install --frozen-lockfile

      - name: 运行实验
        working-directory: spikes/k2
        run: |
          case "${{ matrix.group }}" in
            light) RUNNERS="static,static-inproc,node-ts,python,go,hono,orphan,escape" ;;
            *) RUNNERS="${{ matrix.group }}" ;;
          esac
          METHODS=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            if [ "${{ matrix.half }}" = "a" ]; then METHODS="taskkill,taskkill-obs"; else METHODS="job,job-ctrlc,pty-ctrlc"; fi
          fi
          node src/run.mjs --runners "$RUNNERS" --methods "$METHODS" --reps "$REPS" --tmp "$RUNNER_TEMP" --deadline-min 23 --label "$OUT" --out "results/$OUT.json"

      - name: 把汇总写进任务摘要
        if: always()
        working-directory: spikes/k2
        run: node src/summarize.mjs results/*.json >> "$GITHUB_STEP_SUMMARY"

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k2-${{ matrix.os }}-${{ matrix.group }}-${{ matrix.half }}
          path: spikes/k2/results/*.json
          if-no-files-found: warn
          retention-days: 30
