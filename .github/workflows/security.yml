# 每个 PR 和 main 上的依赖安全检查（技术设计 §8.6.3 的“每个 PR”各行）。
# 不需要任何密钥；密钥扫描由仓库设置里的 GitHub secret scanning 负责，不在这里。
name: 安全

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 发版 PR 用默认令牌开，不触发 pull_request；release-please.yml 会手动触发本工作流（决策记录 0015）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: 依赖变更审查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 这个 Action 比较 PR 前后的依赖，只对 pull_request 有意义。不在任务上写 if，
      # 因为被跳过的任务在必过检查里的表现不如一个明确通过的任务稳妥；手动触发（发版分支）时下面一步给出明确的“通过”。
      - name: 检出代码
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 需要仓库设置里打开“依赖图（Dependency graph）”，否则这一步报错。
      # 能读懂 pnpm 11 的 pnpm-lock.yaml：已在真实 PR 上核实（决策记录 0011）。
      - name: 安装 Node（读允许清单用，版本读自 .node-version）
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # 放行统一走 security/allowlist.toml，这里不重复写一份（技术设计 §8.6.3）：
      # 脚本核对清单后输出 root 范围的编号；清单有问题（过期、超限）时脚本失败，审查随之变红。
      # 该 Action 读 pnpm 锁文件分不出开发依赖，所以已登记的例外要这样传进去。
      - name: 读取允许清单里的公告编号
        id: allowlist
        if: github.event_name == 'pull_request'
        run: echo "ids=$(node tooling/ci/allow-ghsas.ts)" >> "$GITHUB_OUTPUT"

      - name: 依赖变更审查
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          allow-ghsas: ${{ steps.allowlist.outputs.ids }}
          # 许可证检查：技术设计只写了“许可证检查”，没有给出允许或禁止的许可证列表，
          # 所以先关闭，等负责人定下列表后再开（见 CONTRIBUTING.md 末尾的待办）
          license-check: false
          comment-summary-in-pr: never

      - name: 发版分支无需依赖变更审查
        if: github.event_name != 'pull_request'
        run: echo "发版 PR 只改 CHANGELOG.md、版本清单和版本号，不改依赖；push 到 main 时这一项本来也不运行。"

  audit-gate:
    name: 审计闸门（pnpm audit，high 与 critical）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 pnpm（版本读自 package.json 的 packageManager 字段）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 安装 Node（版本读自 .node-version）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # pnpm audit 只读锁文件，不需要安装依赖。
      # --ignore-registry-errors：注册表返回非 200 时退出码为 0，免得 npm 抽风挡住所有 PR；
      # 每晚的任务不加这个参数。pnpm audit 发现漏洞时退出码非 0，所以这里 || true，
      # 是否失败交给下一步的闸门看 JSON 内容决定。
      - name: 运行 pnpm audit（只看正式依赖）
        run: pnpm audit --prod --json --ignore-registry-errors > audit.json || true

      - name: 审计闸门（按 security/allowlist.toml 过滤）
        run: node tooling/ci/audit-gate.ts --file audit.json --lenient

  # 只在手动触发时运行（发版分支）：把上面各任务的真实结果同步成同名的提交状态。
  # 手动触发产生的“检查运行”不计入 PR 的合并条件，提交状态才计入（决策记录 0015，tooling/ci/report-statuses.ts）。
  # 这个任务的名字不在必过检查里。
  report:
    name: 回报检查结果（仅发版分支）
    needs: [dependency-review, audit-gate]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Node（版本读自 .node-version）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: 把任务结果记成提交状态
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: node tooling/ci/report-statuses.ts --repo "$REPO" --run-id "$RUN_ID" --sha "$SHA" --self "回报检查结果（仅发版分支）"
