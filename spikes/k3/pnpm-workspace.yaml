# K3 自己的安装设置：不属于根工作区，但依赖安全规则与根目录一致（技术设计 §8.6）。
packages:
  - .

# 发布不满 14 天的版本不装（单位：分钟，20160 = 14 天）
minimumReleaseAge: 20160
# 写入 package.json 时不加 ^ 或 ~
savePrefix: ""
# 安装脚本白名单：与根目录相同，只放行 electron 和 esbuild
allowBuilds:
  electron: true
  esbuild: true
  # electron-builder 的间接依赖（Squirrel 安装器用的，我们只打 NSIS）。它的安装脚本只是按架构挑一个 7z，
  # 这里明确写“不许跑”：strictDepBuilds 默认开着，不表态安装就报错
  electron-winstaller: false
engineStrict: true
