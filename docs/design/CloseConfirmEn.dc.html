<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Runyard close confirmation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#0071E3}a:hover{color:#0058B0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.4">

<div aria-hidden="true" style="position: absolute; inset: 0">
<dc-import name="ServiceEn" hint-size="1440px,900px"></dc-import>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,22,30,0.22)"></div>
<div role="alertdialog" aria-label="Confirm close" style="position: absolute; left: 430px; top: 290px; width: 580px; box-sizing: border-box; border-radius: 28px; padding: 26px 28px 22px 28px; display: flex; flex-direction: column; gap: 18px; background: rgba(250,250,252,0.86); backdrop-filter: blur(50px) saturate(190%); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.14), 0 40px 90px rgba(15,23,42,0.32), inset 0 1px 0 rgba(255,255,255,1)">
<div style="display: flex; gap: 14px; align-items: flex-start">
<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: rgba(0,113,227,0.10); display: flex; align-items: center; justify-content: center; flex: none">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#0058B0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="10" height="10" rx="2.5"/></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 20px; font-weight: 700; line-height: 1.25">Close hono-todo-api and stop it?</div>
<div style="color: #6E6E73; font-size: 13px">Closing the tab stops this playground. Your code and files are not affected, and it runs again the next time you open it.</div>
</div>
</div>
<label style="display: flex; align-items: flex-start; gap: 10px">
<span role="checkbox" aria-checked="false" aria-label="Don’t ask again" style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 5px; border: 1.5px solid #8E8E93; flex: none; margin-top: 0px; display: inline-block"></span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 500">Don’t ask again</span><span style="font-size: 12px; color: #6E6E73">Tabs will then close and stop right away. You can turn the prompt back on in Settings › Editing and running.</span></span>
</label>
<div style="display: flex; justify-content: flex-end; gap: 10px"><button style="height: 40px; padding: 0 22px; border-radius: 20px; border: none; flex: none; white-space: nowrap; display: flex; align-items: center; gap: 8px; font-size: 14px; background: rgba(118,118,128,0.14); font-weight: 500">Cancel</button><button style="height: 40px; padding: 0 22px; border-radius: 20px; border: none; flex: none; white-space: nowrap; display: flex; align-items: center; gap: 8px; font-size: 14px; background: #0071E3; color: #FFFFFF; font-weight: 600; box-shadow: 0 4px 14px rgba(0,113,227,0.25)">Close and stop</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
