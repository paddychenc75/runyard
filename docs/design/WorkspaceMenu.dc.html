<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Runyard 工作区的更多操作菜单</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#0071E3}a:hover{color:#0058B0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.4">

<div aria-hidden="true" style="position: absolute; inset: 0">
<dc-import name="Service" hint-size="1440px,900px"></dc-import>
</div>
<div aria-hidden="true" style="position: absolute; left: 1259px; top: 20px; width: 32px; height: 32px; border-radius: 16px; background: rgba(0,113,227,0.18); box-shadow: inset 0 0 0 1px #0071E3"></div>
<div role="menu" aria-label="hono-todo-api 的更多操作" style="position: absolute; left: 1021px; top: 62px; width: 270px; box-sizing: border-box; padding: 6px; border-radius: 16px; display: flex; flex-direction: column; background: rgba(250,250,252,0.86); backdrop-filter: blur(40px) saturate(190%); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.14), 0 24px 60px rgba(15,23,42,0.28), inset 0 1px 0 rgba(255,255,255,1)">
<sc-for list="{{items}}" as="it" hint-placeholder-count="14">
<sc-if value="{{it.line}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="height: 1px; margin: 5px 10px; background: rgba(0,0,0,0.10)"></div>
</sc-if>
<sc-if value="{{it.item}}" hint-placeholder-val="{{true}}">
<button role="menuitem" style="height: 32px; padding: 0 10px; border-radius: 9px; border: none; background: {{it.bg}}; color: {{it.color}}; font-weight: {{it.weight}}; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%">
<span style="flex: 1; white-space: nowrap">{{it.label}}</span>
<span style="font-size: 12px; color: {{it.hintColor}}; white-space: nowrap">{{it.hint}}</span>
</button>
</sc-if>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const items = [{"line":false,"item":true,"label":"重命名…","hint":"","bg":"#0071E3","color":"#FFFFFF","weight":600,"hintColor":"#FFFFFF"},{"line":false,"item":true,"label":"编辑备注…","hint":"","bg":"transparent","color":"#1D1D1F","weight":400,"hintColor":"#6E6E73"},{"line":false,"item":true,"label":"自动清理…","hint":"现在：关闭","bg":"transparent","color":"#1D1D1F","weight":400,"hintColor":"#6E6E73"},{"line":true,"item":false},{"line":false,"item":true,"label":"另存为模板…","hint":"","bg":"transparent","color":"#1D1D1F","weight":400,"hintColor":"#6E6E73"},{"line":false,"item":true,"label":"创建副本","hint":"","bg":"transparent","color":"#1D1D1F","weight":400,"hintColor":"#6E6E73"},{"line":true,"item":false},{"line":false,"item":true,"label":"在外部编辑器中打开","hint":"","bg":"transparent","color":"#1D1D1F","weight":400,"hintColor":"#6E6E73"},{"line":false,"item":true,"label":"在访达中显示","hint":"","bg":"transparent","color":"#1D1D1F","weight":400,"hintColor":"#6E6E73"},{"line":false,"item":true,"label":"在终端中打开","hint":"","bg":"transparent","color":"#1D1D1F","weight":400,"hintColor":"#6E6E73"},{"line":false,"item":true,"label":"复制路径","hint":"","bg":"transparent","color":"#1D1D1F","weight":400,"hintColor":"#6E6E73"},{"line":false,"item":true,"label":"复制链接","hint":"","bg":"transparent","color":"#1D1D1F","weight":400,"hintColor":"#6E6E73"},{"line":true,"item":false},{"line":false,"item":true,"label":"移到废纸篓","hint":"","bg":"transparent","color":"#C4001A","weight":400,"hintColor":"#6E6E73"}];
return { items };
}
}
</script>
</body>
</html>
