<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Runyard 模板选择器</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;overflow:hidden}
input::placeholder,textarea::placeholder{color:#6E6E73;opacity:1}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#0071E3}a:hover{color:#0058B0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #1D1D1F; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.4">

<div aria-hidden="true" style="position: absolute; inset: 0">
<dc-import name="Main" hint-size="1440px,900px"></dc-import>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,22,30,0.22)"></div>

<div role="dialog" aria-label="新建项目" style="position: absolute; left: 290px; top: 30px; width: 860px; height: 840px; box-sizing: border-box; border-radius: 28px; display: flex; flex-direction: column; overflow: hidden; background: rgba(250,250,252,0.82); backdrop-filter: blur(50px) saturate(190%); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.14), 0 40px 90px rgba(15,23,42,0.32), inset 0 1px 0 rgba(255,255,255,1)">

<label style="height: 64px; flex: none; padding: 0 22px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(0,0,0,0.08)">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#6E6E73" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
<input type="search" placeholder="搜索模板：名称、框架、语言" aria-label="搜索模板" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 18px; color: #1D1D1F">
<span style="font-family: 'SF Mono', Menlo, monospace; font-size: 11px; color: #6E6E73; border: 1px solid rgba(0,0,0,0.14); border-radius: 6px; padding: 2px 7px">esc</span>
</label>

<div style="flex: 1; min-height: 0; display: flex">
<div style="width: 190px; flex: none; padding: 12px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid rgba(0,0,0,0.08)">
<sc-for list="{{cats}}" as="cat" hint-placeholder-count="8">
<button style="height: 36px; padding: 0 12px; border-radius: 10px; border: none; background: {{cat.bg}}; font-weight: {{cat.weight}}; display: flex; align-items: center; text-align: left; width: 100%">
<span style="flex: 1">{{cat.label}}</span><span style="font-size: 12px; color: #6E6E73">{{cat.count}}</span>
</button>
</sc-for>
</div>

<div style="flex: 1; min-width: 0; padding: 8px 14px 0 14px; position: relative; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
<sc-for list="{{items}}" as="item" hint-placeholder-count="10">
<sc-if value="{{item.header}}" hint-placeholder-val="{{false}}">
<div style="flex: none; padding: 10px 12px 4px 12px; font-size: 12px; font-weight: 600; color: #6E6E73">{{item.label}}</div>
</sc-if>
<sc-if value="{{item.card}}" hint-placeholder-val="{{true}}">
<div style="flex: none; height: 42px; padding: 0 12px; border-radius: 14px; display: flex; align-items: center; gap: 12px; background: {{item.bg}}; box-shadow: {{item.ring}}">
<span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 10px; background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 1px 2px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center; font-family: 'SF Mono', Menlo, monospace; font-size: 12px; font-weight: 600; color: #3A3A3C; flex: none">{{item.badge}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="font-size: 14px; font-weight: 600">{{item.name}}</div>
<div style="font-size: 12px; color: {{item.descColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.desc}}</div>
</div>
<sc-if value="{{item.selected}}" hint-placeholder-val="{{false}}">
<button style="height: 32px; padding: 0 16px; border-radius: 16px; border: none; background: #0071E3; color: #FFFFFF; font-weight: 600; flex: none; white-space: nowrap">选择</button>
</sc-if>
</div>
</sc-if>
</sc-for>
<div aria-hidden="true" style="position: absolute; right: 3px; top: 10px; width: 4px; height: 610px; border-radius: 2px; background: rgba(0,0,0,0.28)"></div>
</div>
</div>

<div style="height: 46px; flex: none; padding: 0 20px; display: flex; align-items: center; gap: 18px; border-top: 1px solid rgba(0,0,0,0.08); color: #3A3A3C; font-size: 12px">
<span style="display: flex; align-items: center; gap: 6px"><span style="border: 1px solid rgba(0,0,0,0.14); border-radius: 6px; padding: 1px 6px; background: #FFFFFF">上下键</span>移动</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="border: 1px solid rgba(0,0,0,0.14); border-radius: 6px; padding: 1px 6px; background: #FFFFFF">回车</span>下一步：填写名称和备注</span>
<span style="flex: 1"></span>
<span style="color: #6E6E73">默认名称</span>
<span style="font-family: 'SF Mono', Menlo, monospace; font-weight: 600">react19-4</span>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const catData = [['最近使用', '3', true], ['全部', '13', false], ['页面', '1', false], ['前端', '3', false], ['全栈', '3', false], ['脚本', '3', false], ['服务', '1', false], ['我的', '2', false]];
const cats = catData.map((c) => ({ label: c[0], count: c[1], bg: c[2] ? 'rgba(0,113,227,0.12)' : 'transparent', weight: c[2] ? 600 : 400 }));
const head = (label) => ({ header: true, card: false, label });
const card = (badge, name, desc, selected, warn) => ({ header: false, card: true, badge, name, desc, selected: !!selected, bg: selected ? 'rgba(0,113,227,0.10)' : 'transparent', ring: selected ? 'inset 0 0 0 1.5px rgba(0,113,227,0.55)' : 'none', descColor: warn ? '#8A4B00' : '#6E6E73' });
const items = [
head('最近使用'),
card('Re', 'React 19 + TypeScript', 'React 19.3 · Vite 8.3 · 热更新', true),
card('Ho', 'Hono', 'Hono 4.13 · 自带请求面板，改完代码自动重发'),
card('Py', 'Python（需要 3.12 以上）', '单文件脚本 · 保存后自动运行 · 当前电脑上是 3.13'),
head('页面'),
card('HT', '静态页面', '无需安装任何工具 · 改动即刷新'),
head('前端'),
card('Re', 'React 19 + TypeScript', 'React 19.3 · Vite 8.3 · 热更新'),
card('Re', 'React 18 + TypeScript', 'React 18.3 · Vite 8.3 · 热更新'),
card('Vu', 'Vue 3 + TypeScript', 'Vue 3.5 · Vite 8.3 · 热更新'),
head('全栈'),
card('Nx', 'Next.js 16', 'Next.js 16.4 · 启动约 3 到 5 秒'),
card('Nu', 'Nuxt 4', 'Nuxt 4.6 · 启动约 2 秒'),
card('Nu', 'Nuxt 3', 'Nuxt 3 最后一个版本 · 官方已停止维护', false, true),
head('脚本'),
card('TS', 'Node + TypeScript', '单文件脚本 · 保存后自动运行 · 当前电脑上是 25.6'),
card('Py', 'Python（需要 3.12 以上）', '单文件脚本 · 保存后自动运行 · 当前电脑上是 3.13'),
card('Go', 'Go（需要 1.22 以上）', '单文件程序 · 保存后自动运行 · 当前未安装', false, true),
head('服务'),
card('Ho', 'Hono', 'Hono 4.13 · 自带请求面板，改完代码自动重发'),
head('我的'),
card('Te', 'team-react', '我的模板 · React 19，带团队的 ESLint 配置'),
card('Ap', 'api-mock', '我的模板 · 返回固定 JSON 的接口')
];
return { cats, items };
}
}
</script>
</body>
</html>
