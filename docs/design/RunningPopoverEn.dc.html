<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Runyard Library, running list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input::placeholder{color:#6E6E73;opacity:1}
a{color:#0071E3}a:hover{color:#0058B0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #1D1D1F; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.4">

<div aria-hidden="true" style="position: absolute; inset: 0">
<dc-import name="MainEn" hint-size="1440px,900px"></dc-import>
</div>
<div aria-hidden="true" style="position: absolute; left: 1215.67px; top: 14px; width: 108.25px; height: 44px; border-radius: 22px; background: rgba(0,113,227,0.16); box-shadow: inset 0 0 0 1px rgba(0,113,227,0.35)"></div>
<div role="dialog" aria-label="Running playgrounds" style="position: absolute; right: 116.07999999999993px; top: 66px; width: 420px; box-sizing: border-box; padding: 8px; border-radius: 20px; display: flex; flex-direction: column; background: rgba(250,250,252,0.86); backdrop-filter: blur(40px) saturate(190%); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.14), 0 24px 60px rgba(15,23,42,0.28), inset 0 1px 0 rgba(255,255,255,1)">
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px">
<div style="flex: 1; font-size: 16px; font-weight: 600">Running</div>
<button style="height: 28px; padding: 0 12px; border-radius: 14px; border: none; background: rgba(118,118,128,0.14); color: #C4001A; font-weight: 500; flex: none; white-space: nowrap">Stop all</button>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px; padding: 9px 8px 9px 12px; border-radius: 12px">
<span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 50%; background: #28A745; flex: none"></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<div style="display: flex; align-items: baseline; gap: 8px; min-width: 0"><span style="font-size: 14px; font-weight: 600; white-space: nowrap">{{row.name}}</span><span style="font-size: 12px; color: #6E6E73; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.template}}</span></div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; white-space: nowrap">
<a href="#" style="font-family: 'SF Mono', Menlo, monospace; color: #0071E3; text-decoration: none">{{row.port}}</a>
<span style="color: #6E6E73">{{row.up}}</span>
<sc-if value="{{row.tab}}" hint-placeholder-val="{{true}}"><span style="display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 10px; background: #F0F0F3; color: #3A3A3C"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#3A3A3C" stroke-width="1.3" stroke-linejoin="round"><rect x="1.5" y="2.5" width="9" height="7" rx="1.6"/><path d="M1.5 5h9"/></svg>{{row.tabLabel}}</span></sc-if>
<sc-if value="{{row.agent}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 10px; font-weight: 500; background: rgba(175,82,222,0.12); color: #7A2E9E"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#7A2E9E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 1.5v2M6 8.5v2M1.5 6h2M8.5 6h2M3 3l1.2 1.2M7.8 7.8 9 9M9 3 7.8 4.2M4.2 7.8 3 9"/></svg>{{row.agentLabel}}</span></sc-if>
</div>
<sc-if value="{{row.agent}}" hint-placeholder-val="{{false}}"><div style="font-size: 12px; color: #6E6E73; white-space: nowrap">{{row.idle}}</div></sc-if>
</div>
<button aria-label="{{row.aria}}" style="height: 28px; padding: 0 14px; border-radius: 14px; border: none; background: rgba(118,118,128,0.14); flex: none; white-space: nowrap">{{row.stopLabel}}</button>
</div>
</sc-for>
</div>
<div style="margin: 6px 12px 0 12px; padding: 10px 0 6px 0; border-top: 1px solid rgba(0,0,0,0.07); font-size: 12px; color: #6E6E73">Opened in a tab: stops when the tab closes. Started from the CLI: stops automatically when idle, or stop it here.</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

renderVals() {
const rows = [{"name":"react-counter","template":"React 19","port":":7101","up":"Running 2 h 14 min","agent":false,"tab":true,"stopLabel":"Stop","agentLabel":"CLI · Claude Code","tabLabel":"Tab","aria":"Stop react-counter","idle":"stops automatically when idle"},{"name":"hono-todo-api","template":"Hono","port":":7102","up":"Running 47 min","agent":false,"tab":true,"stopLabel":"Stop","agentLabel":"CLI · Claude Code","tabLabel":"Tab","aria":"Stop hono-todo-api","idle":"stops automatically when idle"},{"name":"hono-1","template":"Hono","port":":7103","up":"Running 31 min","agent":true,"tab":false,"stopLabel":"Stop","agentLabel":"CLI · Claude Code","tabLabel":"Tab","aria":"Stop hono-1","idle":"stops automatically when idle"},{"name":"react19-3","template":"React 19","port":":7104","up":"Running 58 min","agent":true,"tab":false,"stopLabel":"Stop","agentLabel":"CLI · Claude Code","tabLabel":"Tab","aria":"Stop react19-3","idle":"stops automatically when idle"}];
return { rows };
}
}
</script>
</body>
</html>
