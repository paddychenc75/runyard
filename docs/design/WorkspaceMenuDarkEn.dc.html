<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Runyard Workspace more-actions menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#4DA3FF}a:hover{color:#7DBBFF}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: #161618; color: #F5F5F7; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.4">

<div aria-hidden="true" style="position: absolute; inset: 0">
<dc-import name="ServiceDarkEn" hint-size="1440px,900px"></dc-import>
</div>
<div aria-hidden="true" style="position: absolute; left: 1265px; top: 20px; width: 32px; height: 32px; border-radius: 16px; background: rgba(10,132,255,0.20); box-shadow: inset 0 0 0 1px #0A84FF"></div>
<div role="menu" aria-label="More actions for hono-todo-api" style="position: absolute; left: 1027px; top: 62px; width: 270px; box-sizing: border-box; padding: 6px; border-radius: 16px; display: flex; flex-direction: column; background: rgba(44,44,48,0.78); backdrop-filter: blur(40px) saturate(190%); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 0 0 0.5px rgba(255,255,255,0.10), 0 24px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.14)">
<sc-for list="{{items}}" as="it" hint-placeholder-count="14">
<sc-if value="{{it.line}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="height: 1px; margin: 5px 10px; background: rgba(255,255,255,0.14)"></div>
</sc-if>
<sc-if value="{{it.item}}" hint-placeholder-val="{{true}}">
<button role="menuitem" style="height: 32px; padding: 0 10px; border-radius: 9px; border: none; background: {{it.bg}}; color: {{it.color}}; font-weight: {{it.weight}}; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%">
<span style="flex: 1; white-space: nowrap">{{it.label}}</span>
<span style="font-size: 12px; color: {{it.hintColor}}; white-space: nowrap">{{it.hint}}</span>
</button>
</sc-if>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const items = [{"line":false,"item":true,"label":"Rename…","hint":"","bg":"#0A84FF","color":"#FFFFFF","weight":600,"hintColor":"#FFFFFF"},{"line":false,"item":true,"label":"Edit note…","hint":"","bg":"transparent","color":"#F5F5F7","weight":400,"hintColor":"#A1A1A6"},{"line":false,"item":true,"label":"Auto-clean…","hint":"Now: Off","bg":"transparent","color":"#F5F5F7","weight":400,"hintColor":"#A1A1A6"},{"line":true,"item":false},{"line":false,"item":true,"label":"Save as template…","hint":"","bg":"transparent","color":"#F5F5F7","weight":400,"hintColor":"#A1A1A6"},{"line":false,"item":true,"label":"Duplicate","hint":"","bg":"transparent","color":"#F5F5F7","weight":400,"hintColor":"#A1A1A6"},{"line":true,"item":false},{"line":false,"item":true,"label":"Open in external editor","hint":"","bg":"transparent","color":"#F5F5F7","weight":400,"hintColor":"#A1A1A6"},{"line":false,"item":true,"label":"Show in Finder","hint":"","bg":"transparent","color":"#F5F5F7","weight":400,"hintColor":"#A1A1A6"},{"line":false,"item":true,"label":"Open in Terminal","hint":"","bg":"transparent","color":"#F5F5F7","weight":400,"hintColor":"#A1A1A6"},{"line":false,"item":true,"label":"Copy path","hint":"","bg":"transparent","color":"#F5F5F7","weight":400,"hintColor":"#A1A1A6"},{"line":false,"item":true,"label":"Copy link","hint":"","bg":"transparent","color":"#F5F5F7","weight":400,"hintColor":"#A1A1A6"},{"line":true,"item":false},{"line":false,"item":true,"label":"Move to Trash","hint":"","bg":"transparent","color":"#FF9F99","weight":400,"hintColor":"#A1A1A6"}];
return { items };
}
}
</script>
</body>
</html>
