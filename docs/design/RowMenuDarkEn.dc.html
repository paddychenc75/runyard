<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Runyard library row menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#4DA3FF}a:hover{color:#7DBBFF}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: #1C1C1E; color: #F5F5F7; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.4">

<div aria-hidden="true" style="position: absolute; inset: 0">
<dc-import name="MainDarkEn" hint-size="1440px,900px"></dc-import>
</div>

<!-- the pressed "more" button of the first row -->
<div aria-hidden="true" style="position: absolute; left: 1362px; top: 208px; width: 32px; height: 32px; border-radius: 16px; background: rgba(10,132,255,0.20); box-shadow: inset 0 0 0 1px rgba(10,132,255,0.55)"></div>

<div role="menu" aria-label="More actions for react-counter" style="position: absolute; left: 1142px; top: 246px; width: 252px; box-sizing: border-box; padding: 6px; border-radius: 16px; display: flex; flex-direction: column; background: rgba(44,44,48,0.78); backdrop-filter: blur(40px) saturate(190%); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 0 0 0.5px rgba(255,255,255,0.10), 0 24px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.14)">
<sc-for list="{{items}}" as="it" hint-placeholder-count="18">
<sc-if value="{{it.line}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="height: 1px; margin: 5px 10px; background: rgba(255,255,255,0.14)"></div>
</sc-if>
<sc-if value="{{it.item}}" hint-placeholder-val="{{true}}">
<button role="menuitem" style="height: 32px; padding: 0 10px; border-radius: 9px; border: none; background: {{it.bg}}; color: {{it.color}}; font-weight: {{it.weight}}; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%">
<span style="flex: 1; white-space: nowrap">{{it.label}}</span>
<span style="font-size: 12px; color: {{it.hintColor}}; white-space: nowrap">{{it.hint}}</span>
</button>
</sc-if>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const line = () => ({ line: true, item: false });
const item = (label, hint, kind) => ({ line: false, item: true, label, hint: hint || '', bg: kind === 'on' ? '#0071E3' : 'transparent', color: kind === 'on' ? '#FFFFFF' : kind === 'danger' ? '#FF9F99' : '#F5F5F7', weight: kind === 'on' ? 600 : 400, hintColor: kind === 'on' ? '#FFFFFF' : '#A1A1A6' });
const items = [
item('Open', 'Return', 'on'),
item('Open without running'),
item('Stop'),
line(),
item('Rename…'),
item('Edit note…'),
item('Auto-clean…', 'Now: kept'),
line(),
item('Save as template…'),
item('Duplicate'),
line(),
item('Open in external editor'),
item('Show in Finder'),
item('Open in Terminal'),
item('Copy path'),
item('Copy link'),
line(),
item('Move to Trash', '', 'danger')
];
return { items };
}
}
</script>
</body>
</html>
