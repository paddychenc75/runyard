<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Runyard 模板选择器</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;overflow:hidden}
input::placeholder,textarea::placeholder{color:#A1A1A6;opacity:1}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#4DA3FF}a:hover{color:#7DBBFF}
/* 模板徽标（视觉规范第 7 节，#318）：字母用代表色，HTML5、Vue、Python 用标志 */
[data-tile="Re"]{color:#61DAFB !important}
[data-tile="Go"]{color:#00ADD8 !important}
[data-tile="NT"]{color:#5FA04E !important}
[data-tile="Ho"]{color:#FF8A3D !important}
[data-tile="HT"]{color:transparent !important;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20fill%3D%22%23F06529%22%20d%3D%22M1.5%200h21l-1.91%2021.563L11.977%2024l-8.564-2.438L1.5%200zm7.031%209.75l-.232-2.718%2010.059.003.23-2.622L5.412%204.41l.698%208.01h9.126l-.326%203.426-2.91.804-2.955-.81-.188-2.11H6.248l.33%204.171L12%2019.351l5.379-1.443.744-8.157H8.531z%22%2F%3E%3C%2Fsvg%3E')}
[data-tile="Vu"]{color:transparent !important;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20fill%3D%22%234FC08D%22%20d%3D%22M24%2C1.61H14.06L12%2C5.16%2C9.94%2C1.61H0L12%2C22.39ZM12%2C14.08%2C5.16%2C2.23H9.59L12%2C6.41l2.41-4.18h4.43Z%22%2F%3E%3C%2Fsvg%3E')}
[data-tile="Py"]{color:transparent !important;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20fill%3D%22%233776AB%22%20d%3D%22M14.25.18l.9.2.73.26.59.3.45.32.34.34.25.34.16.33.1.3.04.26.02.2-.01.13V8.5l-.05.63-.13.55-.21.46-.26.38-.3.31-.33.25-.35.19-.35.14-.33.1-.3.07-.26.04-.21.02H8.77l-.69.05-.59.14-.5.22-.41.27-.33.32-.27.35-.2.36-.15.37-.1.35-.07.32-.04.27-.02.21v3.06H3.17l-.21-.03-.28-.07-.32-.12-.35-.18-.36-.26-.36-.36-.35-.46-.32-.59-.28-.73-.21-.88-.14-1.05-.05-1.23.06-1.22.16-1.04.24-.87.32-.71.36-.57.4-.44.42-.33.42-.24.4-.16.36-.1.32-.05.24-.01h.16l.06.01h8.16v-.83H6.18l-.01-2.75-.02-.37.05-.34.11-.31.17-.28.25-.26.31-.23.38-.2.44-.18.51-.15.58-.12.64-.1.71-.06.77-.04.84-.02%201.27.05zm-6.3%201.98l-.23.33-.08.41.08.41.23.34.33.22.41.09.41-.09.33-.22.23-.34.08-.41-.08-.41-.23-.33-.33-.22-.41-.09-.41.09z%22%2F%3E%3Cpath%20fill%3D%22%23FFD43B%22%20d%3D%22M21.04%206.11l.28.06.32.12.35.18.36.27.36.35.35.47.32.59.28.73.21.88.14%201.04.05%201.23-.06%201.23-.16%201.04-.24.86-.32.71-.36.57-.4.45-.42.33-.42.24-.4.16-.36.09-.32.05-.24.02-.16-.01h-8.22v.82h5.84l.01%202.76.02.36-.05.34-.11.31-.17.29-.25.25-.31.24-.38.2-.44.17-.51.15-.58.13-.64.09-.71.07-.77.04-.84.01-1.27-.04-1.07-.14-.9-.2-.73-.25-.59-.3-.45-.33-.34-.34-.25-.34-.16-.33-.1-.3-.04-.25-.02-.2.01-.13v-5.34l.05-.64.13-.54.21-.46.26-.38.3-.32.33-.24.35-.2.35-.14.33-.1.3-.06.26-.04.21-.02.13-.01h5.84l.69-.05.59-.14.5-.21.41-.28.33-.32.27-.35.2-.36.15-.36.1-.35.07-.32.04-.28.02-.21V6.07h2.09l.14.01zm-6.47%2014.25l-.23.33-.08.41.08.41.23.33.33.23.41.08.41-.08.33-.23.23-.33.08-.41-.08-.41-.23-.33-.33-.23-.41-.08-.41.08z%22%2F%3E%3C%2Fsvg%3E')}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: #1C1C1E; color: #F5F5F7; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.4">

<div aria-hidden="true" style="position: absolute; inset: 0">
<dc-import name="MainDark" hint-size="1440px,900px"></dc-import>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.45)"></div>

<div role="dialog" aria-label="新建项目" style="position: absolute; left: 290px; top: 30px; width: 860px; height: 840px; box-sizing: border-box; border-radius: 28px; display: flex; flex-direction: column; overflow: hidden; background: rgba(44,44,48,0.78); backdrop-filter: blur(50px) saturate(190%); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 0 0 0.5px rgba(255,255,255,0.10), 0 40px 90px rgba(0,0,0,0.60), inset 0 1px 0 rgba(255,255,255,0.14)">

<label style="height: 64px; flex: none; padding: 0 22px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.08)">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#A1A1A6" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
<input type="search" placeholder="搜索模板：名称、框架、语言" aria-label="搜索模板" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 18px; color: #F5F5F7">
<span style="font-family: 'SF Mono', Menlo, monospace; font-size: 11px; color: #A1A1A6; border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; padding: 2px 7px">esc</span>
</label>

<div style="flex: 1; min-height: 0; display: flex">
<div style="width: 190px; flex: none; padding: 12px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid rgba(255,255,255,0.08)">
<sc-for list="{{cats}}" as="cat" hint-placeholder-count="8">
<button style="height: 36px; padding: 0 12px; border-radius: 10px; border: none; background: {{cat.bg}}; font-weight: {{cat.weight}}; display: flex; align-items: center; text-align: left; width: 100%">
<span style="flex: 1">{{cat.label}}</span><span style="font-size: 12px; color: #A1A1A6">{{cat.count}}</span>
</button>
</sc-for>
</div>

<div style="flex: 1; min-width: 0; padding: 8px 14px 0 14px; position: relative; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
<sc-for list="{{items}}" as="item" hint-placeholder-count="10">
<sc-if value="{{item.header}}" hint-placeholder-val="{{false}}">
<div style="flex: none; padding: 10px 12px 4px 12px; font-size: 12px; font-weight: 600; color: #A1A1A6">{{item.label}}</div>
</sc-if>
<sc-if value="{{item.card}}" hint-placeholder-val="{{true}}">
<div style="flex: none; height: 42px; padding: 0 12px; border-radius: 14px; display: flex; align-items: center; gap: 12px; background: {{item.bg}}; box-shadow: {{item.ring}}">
<span aria-hidden="true" data-tile="{{item.badge}}" style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 6px; background-color: rgba(255,255,255,0.10); background-position: center; background-repeat: no-repeat; background-size: 60% 60%; border: 1px solid rgba(255,255,255,0.08); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: -0.01em; color: #D1D1D6; flex: none">{{item.badge}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="font-size: 14px; font-weight: 600">{{item.name}}</div>
<div style="font-size: 12px; color: {{item.descColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.desc}}</div>
</div>
<sc-if value="{{item.selected}}" hint-placeholder-val="{{false}}">
<button style="height: 32px; padding: 0 16px; border-radius: 16px; border: none; background: #0071E3; color: #FFFFFF; font-weight: 600; flex: none; white-space: nowrap">选择</button>
</sc-if>
</div>
</sc-if>
</sc-for>
<div aria-hidden="true" style="position: absolute; right: 3px; top: 10px; width: 4px; height: 610px; border-radius: 2px; background: rgba(255,255,255,0.30)"></div>
</div>
</div>

<div style="height: 46px; flex: none; padding: 0 20px; display: flex; align-items: center; gap: 18px; border-top: 1px solid rgba(255,255,255,0.08); color: #D1D1D6; font-size: 12px">
<span style="display: flex; align-items: center; gap: 6px"><span style="border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; padding: 1px 6px; background: rgba(255,255,255,0.10)">上下键</span>移动</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; padding: 1px 6px; background: rgba(255,255,255,0.10)">回车</span>下一步：填写名称和备注</span>
<span style="flex: 1"></span>
<span style="color: #A1A1A6">默认名称</span>
<span style="font-family: 'SF Mono', Menlo, monospace; font-weight: 600">react19-4</span>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const catData = [['最近使用', '3', true], ['全部', '10', false], ['页面', '1', false], ['前端', '3', false], ['脚本', '3', false], ['服务', '1', false], ['我的', '2', false]];
const cats = catData.map((c) => ({ label: c[0], count: c[1], bg: c[2] ? 'rgba(10,132,255,0.20)' : 'transparent', weight: c[2] ? 600 : 400 }));
const head = (label) => ({ header: true, card: false, label });
const card = (badge, name, desc, selected, warn) => ({ header: false, card: true, badge, name, desc, selected: !!selected, bg: selected ? 'rgba(10,132,255,0.20)' : 'transparent', ring: selected ? 'inset 0 0 0 1.5px rgba(10,132,255,0.55)' : 'none', descColor: warn ? '#FFD60A' : '#A1A1A6' });
const items = [
head('最近使用'),
card('Re', 'React 19 + TypeScript', 'React 19.3 · Vite 8.3 · 热更新', true),
card('Ho', 'Hono', 'Hono 4.13 · 自带请求面板，改完代码自动重发'),
card('Py', 'Python（需要 3.12 以上）', '单文件脚本 · 保存后自动运行 · 当前电脑上是 3.13'),
head('页面'),
card('HT', '静态页面', '无需安装任何工具 · 改动即刷新'),
head('前端'),
card('Re', 'React 19 + TypeScript', 'React 19.3 · Vite 8.3 · 热更新'),
card('Re', 'React 18 + TypeScript', 'React 18.3 · Vite 8.3 · 热更新'),
card('Vu', 'Vue 3 + TypeScript', 'Vue 3.5 · Vite 8.3 · 热更新'),
head('脚本'),
card('NT', 'Node + TypeScript', '单文件脚本 · 保存后自动运行 · 当前电脑上是 25.6'),
card('Py', 'Python（需要 3.12 以上）', '单文件脚本 · 保存后自动运行 · 当前电脑上是 3.13'),
card('Go', 'Go（需要 1.22 以上）', '单文件程序 · 保存后自动运行 · 当前未安装', false, true),
head('服务'),
card('Ho', 'Hono', 'Hono 4.13 · 自带请求面板，改完代码自动重发'),
head('我的'),
card('Te', 'team-react', '我的模板 · React 19，带团队的 ESLint 配置'),
card('Ap', 'api-mock', '我的模板 · 返回固定 JSON 的接口')
];
return { cats, items };
}
}
</script>
</body>
</html>
