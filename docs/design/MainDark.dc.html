<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Runyard 资源库</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;overflow:hidden}
input::placeholder,textarea::placeholder{color:#A1A1A6;opacity:1}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#4DA3FF}a:hover{color:#7DBBFF}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: #1C1C1E; color: #F5F5F7; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; font-size: 13px; line-height: 1.4">

<!-- content layer -->
<div style="position: absolute; left: 256px; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column">
<div style="height: 68px; flex: none"></div>
<div style="padding: 20px 28px 0 28px; display: flex; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.3px">全部</h1>
<div style="color: #A1A1A6">20 个项目 · 4 个正在运行 · 存放在 ~/Runyard</div>
</div>
<div style="display: flex; gap: 8px">
<button style="height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); background: rgba(118,118,128,0.24); display: flex; align-items: center; gap: 6px">类型：全部
<svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#A1A1A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5 5 6.5 8 3.5"/></svg></button>
<button style="height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); background: rgba(118,118,128,0.24); display: flex; align-items: center; gap: 6px">状态：全部
<svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#A1A1A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5 5 6.5 8 3.5"/></svg></button>
<button style="height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); background: rgba(118,118,128,0.24); display: flex; align-items: center; gap: 6px">排序：最近打开
<svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#A1A1A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5 5 6.5 8 3.5"/></svg></button>
</div>
</div>

<div style="margin: 18px 28px 0 28px; display: grid; grid-template-columns: minmax(0, 1.5fr) 132px minmax(0, 1fr) 84px 96px 110px 110px 36px; column-gap: 12px; padding: 0 14px 8px 14px; color: #A1A1A6; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.08)">
<div>名称与备注</div><div>状态</div><div>模板</div><div>端口</div><div>保留</div><div>上次打开</div><div>创建者</div><div></div>
</div>

<div style="margin: 6px 28px 0 28px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="12">
<div style="display: grid; grid-template-columns: minmax(0, 1.5fr) 132px minmax(0, 1fr) 84px 96px 110px 110px 36px; column-gap: 12px; align-items: center; height: 54px; padding: 0 14px; border-radius: 12px; background: {{row.bg}}; box-shadow: {{row.bar}}">
<div style="min-width: 0; display: flex; flex-direction: column; gap: 1px">
<div style="font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.name}}</div>
<div style="font-size: 12px; color: {{row.noteColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.note}}</div>
</div>
<div style="display: flex; align-items: center; gap: 8px; color: {{row.statusColor}}; font-weight: 500">
<span aria-hidden="true" style="width: 9px; height: 9px; border-radius: {{row.dotRadius}}; box-sizing: border-box; background: {{row.dotFill}}; border: 1.5px solid {{row.dotColor}}"></span>{{row.status}}
</div>
<div style="display: flex; align-items: center; gap: 8px; color: #D1D1D6; white-space: nowrap; overflow: hidden">
<span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 7px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-family: 'SF Mono', Menlo, monospace; font-size: 10px; font-weight: 600; color: #D1D1D6; flex: none">{{row.badge}}</span>{{row.template}}
</div>
<div style="font-family: 'SF Mono', Menlo, monospace; font-size: 12px; color: #D1D1D6">{{row.port}}</div>
<div><span title="{{row.tip}}" style="display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; color: {{row.keepColor}}; background: {{row.keepBg}}; border: 1px {{row.keepBorder}} rgba(255,255,255,0.14)">{{row.keep}}</span></div>
<div style="color: #A1A1A6">{{row.opened}}</div>
<div>
<sc-if value="{{row.agent}}" hint-placeholder-val="{{false}}">
<span style="display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; font-weight: 500; color: #D0A8FF; background: rgba(191,90,242,0.24)">
<svg aria-hidden="true" width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#D0A8FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 1.5v2M6 8.5v2M1.5 6h2M8.5 6h2M3 3l1.2 1.2M7.8 7.8 9 9M9 3 7.8 4.2M4.2 7.8 3 9"/></svg>{{row.agentLabel}}</span>
</sc-if>
<sc-if value="{{row.mine}}" hint-placeholder-val="{{true}}"><span style="color: #A1A1A6">我</span></sc-if>
</div>
<button aria-label="更多操作" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: transparent; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="#A1A1A6"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg>
</button>
</div>
</sc-for>
</div>
</div>

<!-- floating glass toolbar -->
<div style="position: absolute; left: 268px; right: 16px; top: 14px; height: 44px; display: flex; align-items: center; gap: 10px">
<div style="height: 44px; padding: 4px; box-sizing: border-box; border-radius: 22px; display: flex; align-items: center; gap: 2px; background: rgba(72,72,78,0.55); backdrop-filter: blur(28px) saturate(180%); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 10px 28px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.14)">
<button style="height: 36px; padding: 0 16px; border-radius: 18px; border: none; background: rgba(255,255,255,0.16); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18); font-weight: 600; display: flex; align-items: center; gap: 7px">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#F5F5F7" stroke-width="1.5" stroke-linejoin="round"><rect x="1.5" y="1.5" width="4.5" height="4.5" rx="1.2"/><rect x="8" y="1.5" width="4.5" height="4.5" rx="1.2"/><rect x="1.5" y="8" width="4.5" height="4.5" rx="1.2"/><rect x="8" y="8" width="4.5" height="4.5" rx="1.2"/></svg>资源库</button>
<button style="height: 36px; padding: 0 12px 0 14px; border-radius: 18px; border: none; background: transparent; color: #D1D1D6; display: flex; align-items: center; gap: 8px">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #30D158"></span>react-counter
<svg role="img" aria-label="关闭并停止" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#A1A1A6" stroke-width="1.5" stroke-linecap="round"><path d="M2 2l6 6M8 2 2 8"/></svg></button>
<button style="height: 36px; padding: 0 12px 0 14px; border-radius: 18px; border: none; background: transparent; color: #D1D1D6; display: flex; align-items: center; gap: 8px">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #30D158"></span>hono-todo-api
<svg role="img" aria-label="关闭并停止" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#A1A1A6" stroke-width="1.5" stroke-linecap="round"><path d="M2 2l6 6M8 2 2 8"/></svg></button>
</div>

<div style="flex: 1"></div>

<label style="height: 44px; width: 300px; padding: 0 16px; box-sizing: border-box; border-radius: 22px; display: flex; align-items: center; gap: 9px; background: rgba(72,72,78,0.55); backdrop-filter: blur(28px) saturate(180%); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 10px 28px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.14)">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#A1A1A6" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
<input type="search" placeholder="搜索名称、备注、模板" aria-label="搜索项目" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; color: #F5F5F7">
<span style="font-family: 'SF Mono', Menlo, monospace; font-size: 11px; color: #A1A1A6; border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; padding: 1px 6px">⌘F</span>
</label>

<button style="height: 44px; padding: 0 16px; border-radius: 22px; display: flex; align-items: center; gap: 8px; font-weight: 500; background: rgba(72,72,78,0.55); backdrop-filter: blur(28px) saturate(180%); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 10px 28px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.14)">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #30D158; box-shadow: 0 0 0 3px rgba(48,209,88,0.22)"></span>4 个运行中</button>

<button style="height: 44px; padding: 0 20px; border-radius: 22px; border: none; background: #0071E3; color: #FFFFFF; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; flex: none; white-space: nowrap; box-shadow: 0 4px 14px rgba(10,132,255,0.35)">
<svg aria-hidden="true" width="13" height="13" viewBox="0 0 12 12" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"/></svg>新建</button>
</div>

<!-- floating glass sidebar -->
<nav aria-label="资源库导航" style="position: absolute; left: 8px; top: 8px; bottom: 8px; width: 240px; box-sizing: border-box; border-radius: 20px; padding: 14px 10px 12px 10px; display: flex; flex-direction: column; gap: 4px; background: rgba(58,58,62,0.55); backdrop-filter: blur(40px) saturate(180%); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 12px 36px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.12)">
<div style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px">
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></span>
</div>
<div style="padding: 14px 10px 6px 10px; font-size: 20px; font-weight: 700; letter-spacing: -0.2px">Runyard</div>

<div style="padding: 10px 10px 4px 10px; font-size: 12px; font-weight: 600; color: #A1A1A6">资源库</div>
<sc-for list="{{nav}}" as="item" hint-placeholder-count="4">
<button style="height: 36px; padding: 0 10px; border-radius: 10px; border: none; background: {{item.bg}}; color: {{item.color}}; font-weight: {{item.weight}}; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 3px; background: {{item.mark}}"></span>
<span style="flex: 1">{{item.label}}</span>
<span style="font-size: 12px; color: {{item.countColor}}">{{item.count}}</span>
</button>
</sc-for>

<div style="padding: 16px 10px 4px 10px; font-size: 12px; font-weight: 600; color: #A1A1A6">管理</div>
<button style="height: 36px; padding: 0 10px; border-radius: 10px; border: none; background: transparent; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#D1D1D6" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.5 14 5v6l-6 3.5L2 11V5z"/><path d="M2 5l6 3.5L14 5M8 8.5v6"/></svg><span style="flex: 1">模板</span><span style="font-size: 12px; color: #A1A1A6">13</span></button>
<button style="height: 36px; padding: 0 10px; border-radius: 10px; border: none; background: transparent; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#D1D1D6" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg><span style="flex: 1">长期未使用</span><span style="font-size: 12px; color: #A1A1A6">7</span></button>
<button style="height: 36px; padding: 0 10px; border-radius: 10px; border: none; background: transparent; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%">
<svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#D1D1D6" stroke-width="1.4" stroke-linecap="round"><path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg><span style="flex: 1">设置</span></button>

<div style="flex: 1"></div>
<div style="padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'SF Mono', Menlo, monospace; font-size: 12px">~/Runyard</div>
<div style="font-size: 12px; color: #A1A1A6">20 个项目 · 共 2.9 GB</div>
</div>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const run = { status: '运行中', statusColor: '#30D158', dotColor: '#30D158', dotFill: '#30D158', dotRadius: '50%' };
const stop = { status: '已停止', statusColor: '#A1A1A6', dotColor: '#8E8E93', dotFill: 'transparent', dotRadius: '50%' };
const crash = { status: '已崩溃', statusColor: '#FF9F99', dotColor: '#FF453A', dotFill: '#FF453A', dotRadius: '2px' };
const kept = { keep: '已保留', keepColor: '#F5F5F7', keepBg: 'rgba(255,255,255,0.10)', keepBorder: 'solid' };
const temp = { keep: '自动清理', keepColor: '#A1A1A6', keepBg: 'transparent', keepBorder: 'dashed' };
const me = { agent: false, mine: true };
const ai = { agent: true, mine: false };
const data = [
['react-counter', 'Re', 'React 19', ':7101', '2 分钟前', run, kept, me, '计数器，试 useState 的批量更新'],
['hono-todo-api', 'Ho', 'Hono', ':7102', '9 分钟前', run, kept, me, '待办接口，给前端 demo 当后端'],
['hono-1', 'Ho', 'Hono', ':7103', '31 分钟前', run, temp, ai, '回显 webhook 请求，核对签名头'],
['react19-3', 'Re', 'React 19', ':7104', '1 小时前', run, temp, ai, '图表库对比：柱状图渲染性能'],
['landing-hero', 'HT', '静态页面', ':7105', '3 小时前', stop, kept, me, '首页大图区域的排版练习'],
['go-channels', 'Go', 'Go', '—', '1 天前', stop, kept, me, '带缓冲的 channel 与 worker 协作'],
['python-2', 'Py', 'Python', '—', '1 天前', stop, temp, ai, 'dataclass 和 pydantic 的校验差异'],
['vue-drag-list', 'Vu', 'Vue 3', ':7106', '2 天前', stop, kept, me, '拖拽排序列表'],
['next16-1', 'Nx', 'Next.js 16', ':7107', '2 天前', stop, kept, me, ''],
['nuxt-blog-demo', 'Nu', 'Nuxt 4', ':7108', '4 天前', stop, kept, me, '内容模块加 Markdown 渲染'],
['node-ts-1', 'TS', 'Node + TypeScript', '—', '6 天前', stop, temp, ai, '清洗 CSV，去掉重复行'],
['react18-1', 'Re', 'React 18', ':7109', '4 个月前', stop, kept, me, '']
];
const left = [0, 0, 30, 30, 0, 0, 29, 0, 0, 0, 24, 0];
const rows0 = data.map((d, i) => Object.assign({ agentLabel: d[0] === 'node-ts-1' ? 'Codex' : 'Claude Code', name: d[0], badge: d[1], template: d[2], port: d[3], opened: d[4], note: d[8] || '未填写备注', noteColor: d[8] ? '#D1D1D6' : '#A1A1A6', bg: i === 0 ? 'rgba(10,132,255,0.18)' : 'transparent', bar: i === 0 ? 'inset 3px 0 0 #0A84FF' : 'none' }, d[5], d[6], d[7]));
const navItems = [['全部', '20', true], ['已保留', '16', false], ['自动清理', '4', false], ['智能体创建', '6', false]];
const nav = navItems.map((n) => ({ label: n[0], count: n[1], bg: n[2] ? '#0071E3' : 'transparent', color: n[2] ? '#FFFFFF' : '#F5F5F7', weight: n[2] ? 600 : 400, mark: n[2] ? '#FFFFFF' : '#8E8E93', countColor: n[2] ? '#FFFFFF' : '#A1A1A6' }));
const tipText = '30 天没打开就移到废纸篓，每次打开重新计时';
const rows = rows0.map((r, i) => { const n = left[i]; return n ? Object.assign({}, r, { keep: '剩 ' + n + ' 天', tip: tipText }) : Object.assign({}, r, { tip: '' }); });
return { rows, nav };
}
}
</script>
</body>
</html>
