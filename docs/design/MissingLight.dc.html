<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const K = '#AD3DA4', S = '#B3261E', F = '#0F68A0', P = '#1D1D1F', N = '#1C00CF';
const t = (text, c) => ({ t: text, c: c || P });
const src = [
[t('package', K), t(' main')],
[t(' ')],
[t('import', K), t(' "fmt"', S)],
[t(' ')],
[t('func', K), t(' worker', F), t('(id '), t('int', K), t(', done '), t('chan', K), t('<- '), t('string', K), t(') {')],
[t('  done <- fmt.'), t('Sprintf', F), t('('), t('"worker %d done"', S), t(', id)')],
[t('}')],
[t(' ')],
[t('func', K), t(' main', F), t('() {')],
[t('  done := '), t('make', F), t('('), t('chan', K), t(' '), t('string', K), t(', '), t('2', N), t(')')],
[t('  go', K), t(' worker', F), t('('), t('1', N), t(', done)')],
[t('  fmt.'), t('Println', F), t('(<-done)')],
[t('}')]
];
const lines = src.map((tokens, i) => ({ no: String(i + 1), tokens }));
return { lines };
}
}
</script>
