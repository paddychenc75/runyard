name: runyard
version: 1
description: Runyard 的规格驱动流程：提案 → 规格增量 → 任务（技术决定写 ADR，不在每次改动里再写设计）
artifacts:
  - id: proposal
    generates: proposal.md
    description: 提案：为什么改、改什么、涉及哪些能力
    template: proposal.md
    instruction: |
      写提案，说明这次改动为什么需要。

      章节：
      - **为什么**：不少于 50 个字，说清问题和为什么现在做。
      - **改什么**：条目列出新增、修改、删除的行为；破坏性改动标 **BREAKING**。
      - **能力**：
        - 新增的能力：每个对应一个新的 `specs/<能力路径>/spec.md`。用持久的行为命名（如 `run/ownership`），不用某次要做的事命名（不要 `add-stop-button`）。路径是两级 `<领域>/<能力>`，全小写加连字符，沿用项目现有的组织。
        - 修改的能力：要求发生变化的现有能力，用 `openspec/specs/` 下的原路径；只有规格层面的行为变了才列，只改实现不列。
      - **不做什么**：明确排除的范围。
      - **影响**：涉及的包、命令、文件格式，以及要不要改 PRD。

      “能力”一节是提案和规格之间的合同。先查清现有规格：运行 `pnpm spec list --specs` 看能力清单，对相关的运行 `pnpm spec show "<能力路径>" --type spec` 读全文（含场景），再决定哪些已覆盖、哪些要改。沿用现有能力的原路径，不要造近似的新名字。

      每次改动要么至少声明一个能力（新增或修改），要么在改动的 `.openspec.yaml` 里设 `skip_specs: true`（纯重构、工具、文档，行为没变）。不要为了通过校验硬编一条要求。

      提案不超过一页，重点是“为什么”，不是“怎么做”；技术决定写 ADR。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 规格增量：本次改动对规格的修改
    template: spec.md
    instruction: |
      写规格增量，定义系统应该表现出什么行为。规格是行为合同，不是实现计划。

      该写的：用户或下游系统依赖的可观察行为；输入、输出和错误情况；外部约束（安全、可靠性、兼容性）；能直接变成测试的场景。
      不该写的：类名、函数名、库的选择、一步步的实现细节。
      快速判断：把实现整个换一种写法，这句话还成立吗？成立的才是规格。

      每个提案里列出的能力写一个文件 `specs/<能力路径>/spec.md`，保留完整路径。修改现有能力时用 `openspec/specs/` 下的原路径，不移动、不改名。除非设了 `skip_specs: true`，至少要有一个规格文件。

      增量的操作用 `##` 标题：
      - **ADDED Requirements**：新增的要求
      - **MODIFIED Requirements**：改变的要求，必须写完整的新内容（复制现有整块，从 `### Requirement:` 到全部场景，再改）；只补充新内容、不改旧行为时用 ADDED
      - **REMOVED Requirements**：删除的要求，必须写 **Reason** 和 **Migration**
      - **RENAMED Requirements**：只改名，用 FROM:/TO: 写法

      格式：
      - 每条要求：`### Requirement: <名字>`，正文用 MUST（不用 should / may），正文后单独一行“来源：PRD #prd-…”（没有 PRD 出处的写“来源：ADR NNNN”或“来源：实现细节”）
      - 每个场景：`#### Scenario: [编号] <名字>`，**必须正好四个 `#`**，用 WHEN / THEN 写，最后一行写“验证：test”或“验证：manual（原因）”
      - 场景编号由能力路径得出，如 `run/ownership` 的第 3 个是 `[RUN-OWNERSHIP-03]`，起了就不改、不复用
      - 每条要求至少一个场景
      - 要求正文（到第一个场景之前）不超过 500 个字符，一条要求只说一个行为，例子和边界情况放进场景

      只有新能力的增量以 `## Purpose` 开头：一两句话、不少于 50 个字，说明这个能力是做什么的；归档时它会被复制进新的主规格。现有能力的增量不要写 Purpose。

      示例：
      ```
      # 规格增量

      ## Purpose

      每一次运行有一个持有者，本规格约定标签页关闭时运行会发生什么。

      ## ADDED Requirements

      ### Requirement: 关闭标签页即停止运行
      标签页持有的运行 MUST 在标签页关闭后 3 秒内停止整棵进程树并释放端口。
      来源：PRD #prd-run-ownership

      #### Scenario: [RUN-OWNERSHIP-01] 关掉正在运行的标签页
      - **WHEN** 用户关闭一个状态为 ready 的项目标签页
      - **THEN** 该运行在 3 秒内变为 stopped，端口可重新绑定
      - 验证：test
      ```
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 任务清单：可勾选的实现步骤
    template: tasks.md
    instruction: |
      写任务清单，把实现拆成可以逐条勾选的步骤。

      **严格按模板的格式写**，实现阶段靠复选框格式统计进度：只有 `- [x]`（大小写、空格不限）算完成，其他写法都算未完成，没有复选框的行不被统计。

      要求：
      - 相关的任务放在带编号的 `##` 标题下
      - 每条任务是一个复选框：`- [ ] X.Y 任务描述`
      - 每条任务写明改哪个包，并对应哪个场景编号（如 `[RUN-OWNERSHIP-01]`）
      - 每条任务写明怎样验证完成（测试、命令或可观察的行为），写在这一条里；只有跨多个任务的整体验证才单列
      - 每一组任务自己带上它该有的测试和文档，不要把测试和文档攒到最后一组
      - 小到一次能做完；按依赖排序，先做的在前

      任务清单对着规格写要建什么。
    requires:
      - specs

apply:
  requires: [ tasks ]
  tracks: tasks.md
  instruction: |
    先读上下文文件，按未完成的任务逐条实现，做一条勾一条。每个场景先写带编号的测试。遇到阻碍或需要澄清就停下来问。
