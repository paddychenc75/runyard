# 依赖安全允许清单（技术设计 §8.6.3）。现有一条负责人批准的例外（braces）和四条“修复版未满发布期”的临时放行（见下）。
#
# 只有四种情况可以加条目：公告没有修复版本；修复版本要升大版本、会破坏上游包；
# 只影响开发时工具、不进成品并说明为什么到不了；
# 第四种：修复版本已发布、但还没满 15 天发布期（负责人批准的临时放行，§12 第 51 项）。
# 每条都要写理由和到期日。
# 期限上限：默认 30 天；带 owner_approved（必须指向 §12 的某一项）的条目 60 天；
# 第四种另写 fix_released（修复版发布日），owner_approved 指向 §12 第 51 项，expires 最晚是发布日加 15 天，
# 到期当天升级到修复版并删掉条目，不续期。
# deps-policy 检查会核对字段齐全、没有过期、期限没超上限（第四种还核对发布日加 15 天）。
#
# 条目格式：
#
# [[allow]]
# id = "GHSA-xxxx-xxxx-xxxx"
# scope = "root"                # 或 "template:<id>"
# package = "包名"
# reason = "为什么可以暂时放行"
# expires = 2026-11-11
# # 第四种情况再加两个字段：
# owner_approved = "§12 第 51 项，2026-10-26"
# fix_released = 2026-10-12     # 修复版发布日

# 负责人批准的唯一例外 A（技术设计 §9.6.3，§12 第 30 项）：OpenSpec 的间接依赖 braces 3.0.3（经 fast-glob）。
# 上游修复版本一发布（跟踪上游 issue #2051）就升级并删掉本条，不等到期。
[[allow]]
id = "GHSA-vfj7-8cjw-p6xm"
scope = "root"
package = "braces"
reason = "只影响开发时工具：OpenSpec 只在开发机和 CI 里处理仓库自己的规格文件，输入里没有攻击者可控的数据，最坏结果是它自己崩溃，不进任何成品；公告在 GitHub 公告库里至今没有修复版本"
expires = 2026-12-15
owner_approved = "§12 第 30 项，2026-10-12"

# 第四种情况（§12 第 51 项，2026-10-26）：修复版已发布但未满发布期，满 15 天当天升级并删除。

[[allow]]
id = "GHSA-cg2g-xh64-v4q7"
scope = "root"
package = "dompurify"
reason = "修复版 3.4.17 已发布（2026-10-12），但未满 15 天发布期，按规则暂不能装；经 monaco-editor 带入；到期（2026-10-27）即升级并删除本条，不续期"
expires = 2026-10-27
owner_approved = "§12 第 51 项，2026-10-26"
fix_released = 2026-10-12

