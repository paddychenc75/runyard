# 依赖安全允许清单（技术设计 §8.6.3）。目前没有任何条目。
#
# 只有三种情况可以加条目：公告没有修复版本；修复版本要升大版本、会破坏上游包；
# 只影响开发时工具、不进成品并说明为什么到不了。每条都要写理由和到期日。
# 期限上限：默认 30 天；带 owner_approved（必须指向 §12 的某一项）的条目 60 天。
# deps-policy 检查会核对字段齐全、没有过期、期限没超上限。
#
# 条目格式：
#
# [[allow]]
# id = "GHSA-xxxx-xxxx-xxxx"
# scope = "root"                # 或 "template:<id>"
# package = "包名"
# reason = "为什么可以暂时放行"
# expires = 2026-11-11
