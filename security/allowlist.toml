# 依赖安全允许清单（技术设计 §8.6.3）。目前只有一条负责人批准的例外（braces，见下）。
#
# 只有三种情况可以加条目：公告没有修复版本；修复版本要升大版本、会破坏上游包；
# 只影响开发时工具、不进成品并说明为什么到不了。每条都要写理由和到期日。
# 期限上限：默认 30 天；带 owner_approved（必须指向 §12 的某一项）的条目 60 天。
# deps-policy 检查会核对字段齐全、没有过期、期限没超上限。
#
# 条目格式：
#
# [[allow]]
# id = "GHSA-xxxx-xxxx-xxxx"
# scope = "root"                # 或 "template:<id>"
# package = "包名"
# reason = "为什么可以暂时放行"
# expires = 2026-11-11

# 负责人批准的唯一例外 A（技术设计 §9.6.3，§12 第 30 项）：OpenSpec 的间接依赖 braces 3.0.3（经 fast-glob）。
# 上游修复版本一发布（跟踪上游 issue #2051）就升级并删掉本条，不等到期。
[[allow]]
id = "GHSA-vfj7-8cjw-p6xm"
scope = "root"
package = "braces"
reason = "只影响开发时工具：OpenSpec 只在开发机和 CI 里处理仓库自己的规格文件，输入里没有攻击者可控的数据，最坏结果是它自己崩溃，不进任何成品；公告在 GitHub 公告库里至今没有修复版本"
expires = 2026-12-15
owner_approved = "§12 第 30 项，2026-10-12"
